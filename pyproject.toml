[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diarization-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented diarization claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
diarization-claim-audit = "diarization_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["diarization_claim_audit*"]
